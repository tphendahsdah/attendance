<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIC Ledger — Student Accounts & Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#F6F7F5;
  --paper-raised:#FFFFFF;
  --ink-900:#121A1F;
  --ink-700:#37444B;
  --ink-500:#647178;
  --ink-300:#9AA6AB;
  --line:#DEE4E0;
  --line-strong:#C7D0CB;
  --primary:#0F6E5C;
  --primary-dark:#0A4F42;
  --primary-tint:#E4F1EC;
  --amber:#B07A22;
  --amber-tint:#F7EFDC;
  --danger:#AE3B3B;
  --danger-tint:#F7E7E7;
  --gcash:#0072CE;
  --gcash-tint:#E4F1FC;
  --paypal:#142C8E;
  --paypal-gold:#FFC439;
  --paypal-tint:#E9ECF9;
  --shadow-modal:0 24px 64px rgba(18,26,31,.28);
  --shadow-pop:0 2px 10px rgba(18,26,31,.08);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151A; --paper-raised:#171E24; --ink-900:#F1F4F3; --ink-700:#C6D0D3;
    --ink-500:#8E9BA1; --ink-300:#5B6870; --line:#28323A; --line-strong:#38434C;
    --primary:#2FA98A; --primary-dark:#237E68; --primary-tint:#153029;
    --amber:#D8A34F; --amber-tint:#2E2717; --danger:#E08484; --danger-tint:#331F1F;
    --gcash:#4FA6EF; --gcash-tint:#122232; --paypal:#7C8CEF; --paypal-tint:#1B2036;
    --shadow-modal:0 24px 64px rgba(0,0,0,.5); --shadow-pop:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#10151A; --paper-raised:#171E24; --ink-900:#F1F4F3; --ink-700:#C6D0D3;
  --ink-500:#8E9BA1; --ink-300:#5B6870; --line:#28323A; --line-strong:#38434C;
  --primary:#2FA98A; --primary-dark:#237E68; --primary-tint:#153029;
  --amber:#D8A34F; --amber-tint:#2E2717; --danger:#E08484; --danger-tint:#331F1F;
  --gcash:#4FA6EF; --gcash-tint:#122232; --paypal:#7C8CEF; --paypal-tint:#1B2036;
  --shadow-modal:0 24px 64px rgba(0,0,0,.5); --shadow-pop:0 2px 10px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink-900); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; min-height:100vh; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink-900);}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--primary-tint); color:var(--primary-dark);}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ============ LAYOUT PRIMITIVES ============ */
.container{max-width:1180px; margin:0 auto; padding:0 20px;}
.hidden{display:none !important;}
.muted{color:var(--ink-500);}
.small{font-size:12.5px;}
.divider{height:1px; background:var(--line); border:0; margin:0;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; letter-spacing:.2px;}
.badge.paid{background:var(--primary-tint); color:var(--primary-dark);}
.badge.pending{background:var(--amber-tint); color:var(--amber);}
.badge.overdue{background:var(--danger-tint); color:var(--danger);}
.badge.voided{background:var(--line); color:var(--ink-500);}
.icon{width:18px; height:18px; display:inline-block; vertical-align:middle;}
.icon svg{width:100%; height:100%; display:block;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-sm); border:1px solid transparent; font-weight:600; font-size:14px;
  padding:10px 18px; transition:background .15s ease, border-color .15s ease, transform .05s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent; color:var(--ink-700); border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--paper-raised); border-color:var(--ink-500);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-tint);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{
  width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-700);
}
.icon-btn:hover{border-color:var(--ink-500);}

/* ============ FORMS ============ */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-700);}
.field .hint{font-size:11.5px; color:var(--ink-500); font-weight:400;}
.field input, .field select, .field textarea{
  border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-900);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.input-money{position:relative;}
.input-money::before{content:"\20B1"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-500); font-weight:600;}
.input-money input{padding-left:26px;}
.error-text{color:var(--danger); font-size:12px; margin-top:4px; display:none;}
.error-text.show{display:block;}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
  radial-gradient(circle at 15% 10%, var(--primary-tint) 0%, transparent 45%), var(--paper);}
.login-card{width:100%; max-width:960px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
  display:grid; grid-template-columns:1.1fr 1fr; overflow:hidden; box-shadow:var(--shadow-pop);}
@media (max-width:820px){.login-card{grid-template-columns:1fr;}}
.login-hero{background:var(--ink-900); color:#F6F7F5; padding:44px 40px; display:flex; flex-direction:column; justify-content:space-between; gap:32px;}
.login-hero .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px;}
.login-hero .brand-mark{width:34px; height:34px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:17px;}
.login-hero h1{font-size:clamp(28px,4vw,36px); color:#fff; line-height:1.15; font-weight:600;}
.login-hero .sub{color:#B9C4C1; font-size:14.5px; line-height:1.6; max-width:38ch;}
.login-stat-row{display:flex; gap:28px; border-top:1px solid #2A353A; padding-top:20px;}
.login-stat b{display:block; font-family:var(--font-display); font-size:22px; color:#fff;}
.login-stat span{font-size:11.5px; color:#9BA9A5; text-transform:uppercase; letter-spacing:.6px;}
.login-panel{padding:40px; display:flex; flex-direction:column;}
.role-tabs{display:flex; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:3px; margin-bottom:26px;}
.role-tabs button{flex:1; border:0; background:transparent; padding:9px; border-radius:4px; font-weight:600; font-size:13.5px; color:var(--ink-500);}
.role-tabs button.active{background:var(--ink-900); color:#fff;}
.login-panel h2{font-size:20px; margin-bottom:4px;}
.login-panel .sub{color:var(--ink-500); font-size:13px; margin-bottom:22px;}
.demo-box{background:var(--paper); border:1px dashed var(--line-strong); border-radius:var(--radius-sm); padding:12px 14px; font-size:12px; color:var(--ink-500); margin-top:8px; line-height:1.7;}
.demo-box b{color:var(--ink-700);}
.login-error{background:var(--danger-tint); color:var(--danger); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:14px; display:none;}
.login-error.show{display:block;}

/* ============ APP SHELL — shared ============ */
.topbar{position:sticky; top:0; z-index:30; background:var(--paper-raised); border-bottom:1px solid var(--line);}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; padding:12px 20px; gap:12px;}
.brand-sm{display:flex; align-items:center; gap:9px; font-weight:700; font-size:14.5px;}
.brand-sm .brand-mark{width:26px; height:26px; border-radius:6px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:13px; font-weight:700;}
.who{display:flex; align-items:center; gap:10px;}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; font-family:var(--font-display);}
.who-name{font-size:13px; font-weight:600; line-height:1.2;}
.who-sub{font-size:11px; color:var(--ink-500);}

/* ---- Student tabs ---- */
.stu-tabs{display:flex; gap:2px; padding:0 20px; overflow-x:auto;}
.stu-tabs button{border:0; background:transparent; padding:12px 14px; font-size:13px; font-weight:600; color:var(--ink-500); border-bottom:2px solid transparent; white-space:nowrap; display:flex; align-items:center; gap:7px;}
.stu-tabs button.active{color:var(--primary-dark); border-bottom-color:var(--primary);}
.mobile-tabbar{display:none;}
@media (max-width:680px){
  .stu-tabs{display:none;}
  .mobile-tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper-raised);
    border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-tabbar button{flex:1; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--ink-500); font-size:10.5px; font-weight:600;}
  .mobile-tabbar button.active{color:var(--primary-dark);}
  body.has-mobilebar .page{padding-bottom:76px;}
}

.page{padding:26px 0 60px;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.section-title h2{font-size:19px;}
.section-title .sub{color:var(--ink-500); font-size:13px;}

/* ---- ledger cards ---- */
.ledger-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:22px;}
@media (max-width:720px){.ledger-grid{grid-template-columns:1fr;}}
.ledger-cell{background:var(--paper-raised); padding:20px 22px;}
.ledger-cell .lbl{font-size:12px; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
.ledger-cell .val{font-family:var(--font-display); font-size:clamp(22px,3vw,30px); font-weight:600;}
.ledger-cell .val.pos{color:var(--primary-dark);}
.ledger-cell .val.neg{color:var(--danger);}
.ledger-cell .fine{font-size:12px; color:var(--ink-500); margin-top:6px;}

.panel{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;}
.panel-head h3{font-size:15px;}
.panel-body{padding:4px 20px 18px;}
.panel-body.pad{padding:20px;}

table.ledger-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px;}
table.ledger-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-500); font-weight:700; padding:10px 8px; border-bottom:1px solid var(--line-strong);}
table.ledger-table td{padding:12px 8px; border-bottom:1px solid var(--line);}
table.ledger-table tr:last-child td{border-bottom:0;}
table.ledger-table td.amt, table.ledger-table th.amt{text-align:right;}
table.ledger-table tr.clickable{cursor:pointer;}
table.ledger-table tr.clickable:hover{background:var(--paper);}

.row-flex{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);}
.row-flex:last-child{border-bottom:0;}

.empty-state{text-align:center; padding:44px 20px; color:var(--ink-500);}
.empty-state .icon{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:13.5px;}

/* Pay method cards */
.method-grid{display:grid; grid-template-columns:1fr; gap:12px; margin:14px 0 20px;}
@media (min-width:560px){.method-grid{grid-template-columns:repeat(3,1fr);}}
.method-card{border:1.5px solid var(--line-strong); border-radius:var(--radius-md); padding:16px; cursor:pointer; background:var(--paper-raised); text-align:left; display:flex; flex-direction:column; gap:8px; transition:border-color .12s;}
.method-card:hover{border-color:var(--ink-500);}
.method-card.selected{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);}
.method-chip{display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px; padding:6px 10px; border-radius:6px; width:fit-content;}
.method-chip.gcash{background:var(--gcash-tint); color:var(--gcash);}
.method-chip.paypal{background:var(--paypal-tint); color:var(--paypal);}
.method-chip.cash{background:var(--amber-tint); color:var(--amber);}
.method-chip.qr{background:var(--primary-tint); color:var(--primary-dark);}
.method-card .desc{font-size:12px; color:var(--ink-500);}

/* QR panels */
.qr-shell{max-width:380px; margin:0 auto; text-align:center;}
.qr-box{width:192px; height:192px; margin:0 auto 16px; background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; padding:8px;}
.qr-box img, .qr-box canvas{width:100% !important; height:100% !important;}
.qr-waiting-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--amber); margin-right:6px; animation:pulse 1s infinite ease-in-out;}
.scan-video-wrap{position:relative; width:100%; max-width:340px; margin:0 auto 14px; border-radius:var(--radius-md); overflow:hidden; background:#000; aspect-ratio:4/3;}
.scan-video-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
.qr-pending-item{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
.qr-pending-item:last-child{border-bottom:0;}

/* Gateway simulation */
.gateway-shell{max-width:420px; margin:0 auto; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow-pop);}
.gateway-head{padding:22px 24px; color:#fff;}
.gateway-head.gcash{background:linear-gradient(135deg,#0072CE,#0057A0);}
.gateway-head.paypal{background:linear-gradient(135deg,#142C8E,#0B1B63);}
.gateway-head .gname{font-weight:800; font-size:17px; letter-spacing:.2px;}
.gateway-head .gamt{font-family:var(--font-display); font-size:30px; margin-top:10px;}
.gateway-body{background:var(--paper-raised); padding:24px;}
.demo-banner{background:var(--amber-tint); color:var(--amber); font-size:11.5px; font-weight:700; text-align:center; padding:7px; letter-spacing:.3px;}
.dots-spin{display:flex; gap:6px; justify-content:center; padding:30px 0;}
.dots-spin span{width:9px; height:9px; border-radius:50%; background:var(--primary); animation:pulse 1s infinite ease-in-out;}
.dots-spin span:nth-child(2){animation-delay:.15s;} .dots-spin span:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.85);} 40%{opacity:1; transform:scale(1);}}
.success-check{width:56px; height:56px; border-radius:50%; background:var(--primary-tint); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:6px auto 16px;}

/* Receipt */
.receipt{max-width:420px; margin:0 auto; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md);}
.receipt-top{padding:22px 24px 16px; text-align:center; border-bottom:1px dashed var(--line-strong);}
.receipt-top .rmark{width:38px; height:38px; border-radius:9px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-family:var(--font-display); font-weight:700;}
.receipt-top h3{font-size:16px;}
.receipt-top .sub{font-size:12px; color:var(--ink-500); margin-top:2px;}
.receipt-body{padding:18px 24px;}
.receipt-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--ink-700);}
.receipt-row b{color:var(--ink-900); font-weight:600;}
.receipt-amt{text-align:center; padding:14px 0; margin:10px 0; border-top:1px dashed var(--line-strong); border-bottom:1px dashed var(--line-strong);}
.receipt-amt .amt{font-family:var(--font-display); font-size:32px; color:var(--primary-dark);}
.receipt-amt .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-500); margin-top:4px;}
.receipt-foot{padding:14px 24px 22px; display:flex; gap:10px;}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,17,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center; padding:0;}
@media (min-width:640px){.modal-overlay{align-items:center; padding:24px;}}
.modal{background:var(--paper-raised); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; box-shadow:var(--shadow-modal);}
@media (min-width:640px){.modal{border-radius:var(--radius-lg);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-raised); z-index:2;}
.modal-head h3{font-size:16px;}
.modal-body{padding:22px;}

/* Admin shell */
.admin-shell{display:flex; min-height:100vh;}
.admin-sidebar{width:230px; flex-shrink:0; background:var(--ink-900); color:#E7ECEA; padding:20px 14px; position:fixed; top:0; bottom:0; left:0; z-index:50; transform:translateX(-100%); transition:transform .2s ease; overflow-y:auto;}
.admin-sidebar.open{transform:translateX(0);}
@media (min-width:960px){.admin-sidebar{position:sticky; transform:none;}}
.admin-sidebar .brand{display:flex; align-items:center; gap:9px; font-weight:700; padding:6px 10px 22px; font-size:14.5px;}
.admin-sidebar .brand-mark{width:28px; height:28px; border-radius:7px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:13px;}
.admin-nav button{width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; border:0; background:transparent; color:#B7C4C0; border-radius:8px; font-size:13.5px; font-weight:600; margin-bottom:2px; text-align:left;}
.admin-nav button.active{background:#1E2A2C; color:#fff;}
.admin-nav button:hover{color:#fff;}
.admin-side-foot{margin-top:22px; padding-top:16px; border-top:1px solid #263133; font-size:11.5px; color:#7C8B87; padding-left:12px; line-height:1.6;}
.admin-main{flex:1; min-width:0;}
.admin-content{padding:24px 24px 60px;}
.admin-drawer-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:45; display:none;}
.admin-drawer-backdrop.show{display:block;}
@media (min-width:960px){.admin-drawer-backdrop{display:none !important;}}
.only-mobile-flex{display:none;}
@media (max-width:959px){.only-mobile-flex{display:inline-flex;}}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
@media (max-width:920px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;}
.stat-card .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-500); font-weight:700; margin-bottom:8px;}
.stat-card .val{font-family:var(--font-display); font-size:24px; font-weight:600;}
.stat-card .delta{font-size:11.5px; margin-top:6px; color:var(--ink-500);}

.two-col{display:grid; grid-template-columns:1.4fr 1fr; gap:18px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

.searchbar{display:flex; align-items:center; gap:8px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:8px 12px; background:var(--paper-raised); min-width:200px;}

function loadData(){
  try{

  var seeded = seedData();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(seeded)); }catch(e){}

}
function saveLocal(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(data)); }catch(e){ console.error("local save failed", e); }
}

/* ---- Shared database (Artifact `db` capability) ----
   The whole dataset lives as ONE JSON document (system/data) in the
   artifact's real, persistent database, shared by every signed-in
   viewer of this page. localStorage is kept only as an instant-paint
   cache for the first render and as an offline fallback when db is
   unavailable (e.g. before the page is published, or this view was
   not granted the capability). */
var dbNS = null;
var dbDocRef = null;
var dbWriteChain = Promise.resolve();
var dbAvailable = false;

function saveData(){
  saveLocal();
  if (dbAvailable && dbDocRef){
    dbWriteChain = dbWriteChain.then(function(){ return dbDocRef.set(data); })
      .catch(function(e){ console.error("db write failed", e); });
  }
}

function initDb(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  window.claude.use("db").then(function(ns){
    if (!ns) return;
    dbNS = ns;
    dbDocRef = ns.doc("system/data");
    return dbDocRef.get();
  }).then(function(snap){
    if (!snap) return;
    if (snap.exists && snap.data()){
      var remote = snap.data();
      if (remote && remote.students) data = remote;
      if (!data.qrRequests) data.qrRequests = [];
      saveLocal();
    } else {
      dbDocRef.set(data).catch(function(e){ console.error("db seed failed", e); });
    }
    dbAvailable = true;
    render();
    dbDocRef.onSnapshot(function(snap2){
      if (!snap2.exists) return;
      var incoming = snap2.data();
      if (!incoming || !incoming.students) return;
      data = incoming;
      if (!data.qrRequests) data.qrRequests = [];
      saveLocal();
      render();
    }, function(err){ console.error("db subscribe error", err); });
  }).catch(function(e){ console.error("db init failed", e); });

  window.claude.use("downloads").then(function(ns){ window.__downloadsNS = ns; }).catch(function(){});
}

/* ============================================================
   DOMAIN HELPERS
=============================================================== */
function getStudent(id){
  for (var i=0;i<data.students.length;i++) if (data.students[i].id === id) return data.students[i];
  return null;
}
function currentStudent(){
  if (!state.session || state.session.role !== "student") return null;
  return getStudent(state.session.studentId);
}
function computeTotals(student){
  var totalFees = 0;
  student.fees.forEach(function(f){ totalFees += Number(f.amount)||0; });
  var adj = 0;
  student.adjustments.forEach(function(a){ adj += (a.type === "credit" ? -1 : 1) * (Number(a.amount)||0); });
  var assessment = totalFees + adj;
  var paid = 0;
  student.payments.forEach(function(p){ if (p.status === "Completed") paid += Number(p.amount)||0; });
  var balance = assessment - paid;
  return {totalFees:totalFees, adjustments:adj, assessment:assessment, paid:paid, balance:balance};
}
function initials(name){
  var parts = String(name).trim().split(/\s+/);
  var s = (parts[0]?parts[0][0]:"") + (parts.length>1?parts[parts.length-1][0]:"");
  return s.toUpperCase();
}
function allPayments(){
  var out = [];
  data.students.forEach(function(st){
    st.payments.forEach(function(p){
      out.push(Object.assign({}, p, {studentId:st.id, studentName:st.name, studentNo:st.studentId}));
    });
  });
  out.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  return out;
}
function nextReceiptNo(){
  var n = data.receiptSeq++;
  return "OR-2026-" + n;
}
function receiptFromPayment(stu, payment){
  var idx = stu.payments.indexOf(payment);
  var runningPaid = 0;
  stu.payments.forEach(function(pp,i){ if (i<=idx && pp.status==="Completed") runningPaid += pp.amount; });
  var t = computeTotals(stu);
  var balanceAfter = t.assessment - runningPaid;
  return {
    id: payment.id, receiptNo: payment.receiptNo, date: payment.date, studentName: stu.name, studentNo: stu.studentId,
    method: payment.method, refNo: payment.refNo, amount: payment.amount, balanceAfter: balanceAfter, status: payment.status
  };
}

=============================================================== */
function render(){
  var root = document.getElementById("app");
  document.body.classList.remove("has-mobilebar");
  if (!state.session){
    root.innerHTML = renderLogin();
  } else if (state.session.role === "student"){
    document.body.classList.add("has-mobilebar");
    root.innerHTML = renderStudentApp();
  } else {
    root.innerHTML = renderAdminApp();
  }
  if (state.modal) root.insertAdjacentHTML("beforeend", renderModal());
  if (state.toast) root.insertAdjacentHTML("beforeend", '<div class="toast">'+ic("check")+esc(state.toast)+'</div>');
  mountQrIfNeeded();
}

function mountQrIfNeeded(){
  if (state.session && state.session.role === "student" && state.studentTab === "pay" &&
      state.pay && state.pay.step === "qr-wait" && state.pay.qrPayload){
    var box = document.getElementById("qrCodeBox");
    if (box && window.QRCode){
      box.innerHTML = "";
      try{
        new QRCode(box, {text: state.pay.qrPayload, width:176, height:176, colorDark:"#12181F", colorLight:"#ffffff"});
      }catch(e){ box.textContent = "QR unavailable"; }
    } else if (box){
      box.textContent = "QR code";
    }
  }
}

function renderStuPay(stu){
  var t = computeTotals(stu);
  if (t.balance <= 0){
    return '<div class="section-title"><h2>Pay Fees</h2></div>'+
      '<div class="panel"><div class="panel-body pad">'+emptyState("check","Your account is fully settled \u2014 nothing due right now.")+'</div></div>';
  }
  if (!state.pay) state.pay = {method:null, amount:t.balance, step:"select"};
  var pay = state.pay;

  if (pay.step === "qr-wait" && pay.requestId){
    var liveReq = data.qrRequests.filter(function(r){return r.id===pay.requestId;})[0];
    if (liveReq && liveReq.status === "completed" && liveReq.paymentId){
      var paidRecord = stu.payments.filter(function(p){return p.id===liveReq.paymentId;})[0];
      if (paidRecord){
        pay.step = "success";
        pay.receipt = receiptFromPayment(stu, paidRecord);
      }
    }
  }

  if (pay.step === "gateway") return renderGateway(stu, pay, t);
  if (pay.step === "qr-wait") return renderQrWait(stu, pay, t);
  if (pay.step === "success") return renderPaySuccess(stu, pay);

  return ''+
  '<div class="section-title"><h2>Pay Fees</h2><span class="sub">Outstanding balance: <b class="num">'+fmtMoney(t.balance)+'</b></span></div>'+
  '<div class="panel"><div class="panel-body pad">'+
    '<div class="field input-money" style="max-width:280px;">'+
      '<label>Amount to pay</label>'+
      '<input type="number" min="1" max="'+t.balance+'" step="0.01" id="payAmountInput" value="'+pay.amount+'">'+
      '<div class="hint">Maximum: '+fmtMoney(t.balance)+'</div>'+
      '<div class="error-text" id="payAmountError">Enter an amount between \u20B11 and '+fmtMoney(t.balance)+'.</div>'+
    '</div>'+
    '<button class="btn btn-ghost btn-sm" data-action="pay-fill-full" style="margin-bottom:6px;">Pay full balance</button>'+

    '<div style="margin-top:18px;">'+
      '<label style="font-size:12.5px; font-weight:600; color:var(--ink-700);">Choose payment method</label>'+
      '<div class="method-grid">'+
        '<button type="button" class="method-card '+(pay.method==="GCash"?"selected":"")+'" data-action="pay-select-method" data-method="GCash">'+
          '<span class="method-chip gcash">'+ic("card")+' GCash</span>'+
          '<span class="desc">Pay using your GCash wallet balance or linked cards.</span>'+
        '</button>'+
        '<button type="button" class="method-card '+(pay.method==="PayPal"?"selected":"")+'" data-action="pay-select-method" data-method="PayPal">'+
          '<span class="method-chip paypal">'+ic("card")+' PayPal</span>'+
          '<span class="desc">Pay using your PayPal balance, card, or bank account.</span>'+
        '</button>'+
        '<button type="button" class="method-card '+(pay.method==="QR"?"selected":"")+'" data-action="pay-select-method" data-method="QR">'+
          '<span class="method-chip qr">'+ic("card")+' Scan QR</span>'+
          '<span class="desc">Generate a QR code for the cashier or admin to scan on-site.</span>'+
        '</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn btn-primary btn-block" id="payProceedBtn" data-action="pay-proceed" '+(!pay.method?"disabled":"")+'>Proceed to pay '+fmtMoney(pay.amount||0)+'</button>'+
    '<p class="small muted" style="text-align:center; margin-top:10px;">'+ic("lock")+' Simulated secure checkout \u2014 demo mode, no real funds are moved.</p>'+
  '</div></div>';
}

function renderQrWait(stu, pay, t){
  var req = data.qrRequests.filter(function(r){return r.id===pay.requestId;})[0];
  if (req && req.status === "cancelled"){
    return '<div class="qr-shell"><p class="muted" style="margin-bottom:16px;">This QR payment request was cancelled.</p>'+
      '<button class="btn btn-primary" data-action="pay-new">Back to overview</button></div>';

  return '<div class="qr-shell">'+
    '<div class="demo-banner" style="border-radius:8px; margin-bottom:16px;">DEMO MODE \u2014 SIMULATED PAYMENT</div>'+

    '<p class="sub muted" style="margin-bottom:18px;">Show this code to the cashier, or have an admin scan it under Payments \u2192 Scan QR.</p>'+
    '<div class="qr-box" id="qrCodeBox"></div>'+
    '<p class="small muted" style="margin:14px 0 2px;">Request ref: <b class="num">'+esc(req?req.refNo:"")+'</b></p>'+

    '</div>'+
  '</div>';
}

function orgTotals(){
  var students=0, assessed=0, collected=0, outstanding=0;
  data.students.forEach(function(st){
    students++;
    var t = computeTotals(st);
    assessed += t.assessment; collected += t.paid; outstanding += Math.max(t.balance,0);
  });
  return {students:students, assessed:assessed, collected:collected, outstanding:outstanding,
    rate: assessed>0 ? Math.round((collected/assessed)*100) : 0};
}

function methodBreakdown(fromDate, toDate){
  var totals = {GCash:0, PayPal:0, Cash:0};
  allPayments().forEach(function(p){
    if (p.status !== "Completed") return;
    var d = new Date(p.date);
    if (fromDate && d < fromDate) return;
    if (toDate && d > toDate) return;
    if (totals[p.method] === undefined) totals[p.method] = 0;
    totals[p.method] += p.amount;
  });
  return totals;
}

  else if (m.type === "edit-student"){ title = "Edit student"; body = studentFormHtml(getStudent(m.id)); }
  else if (m.type === "add-fee"){ title = "Add fee to student"; body = addFeeFormHtml(m.sid); }

/* ============================================================

=============================================================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");

  if (action === "close-modal-backdrop"){ if (e.target === el){ stopScan(); state.modal=null; render(); } return; }
  if (action === "close-modal"){ stopScan(); state.modal=null; render(); return; }

  switch(action){
    case "set-login-role":
      state.loginRole = el.getAttribute("data-role"); state.loginError=""; render(); break;
    case "logout":
      state.session = null; saveSession(); state.studentTab="overview"; state.adminTab="overview";
      state.selectedStudentId=null; state.pay=null; render(); break;
    case "student-tab":
      state.studentTab = el.getAttribute("data-tab");
      if (state.studentTab !== "pay") state.pay = null;
      render(); break;
    case "admin-tab":
      state.adminTab = el.getAttribute("data-tab"); state.selectedStudentId=null; state.adminDrawerOpen=false; render(); break;
    case "admin-drawer-toggle":
      state.adminDrawerOpen = !state.adminDrawerOpen; render(); break;
    case "admin-drawer-close":
      state.adminDrawerOpen = false; render(); break;
    case "select-student":
      state.selectedStudentId = el.getAttribute("data-id"); render(); break;
    case "back-to-students":
      state.selectedStudentId = null; render(); break;

    case "open-add-student": state.modal={type:"add-student"}; render(); break;
    case "open-edit-student": state.modal={type:"edit-student", id:el.getAttribute("data-id")}; render(); break;
    case "delete-student":
      state.modal = {type:"confirm", title:"Remove student", message:"This will permanently remove the student account and all its records. This cannot be undone.", confirmLabel:"Remove",
        onConfirm:function(){
          var id = el.getAttribute("data-id");
          data.students = data.students.filter(function(s){return s.id!==id;});
          saveData(); state.selectedStudentId=null; showToast("Student removed");
        }};
      render(); break;

    case "open-add-fee": state.modal={type:"add-fee", sid:el.getAttribute("data-sid")}; render(); break;
    case "remove-student-fee":
      removeFrom(getStudent(el.getAttribute("data-sid")).fees, el.getAttribute("data-fid"));
      saveData(); showToast("Fee removed"); render(); break;

    case "open-add-adjustment": state.modal={type:"add-adjustment", sid:el.getAttribute("data-sid")}; render(); break;
    case "remove-student-adjustment":
      removeFrom(getStudent(el.getAttribute("data-sid")).adjustments, el.getAttribute("data-aid"));
      saveData(); showToast("Adjustment removed"); render(); break;

    case "open-record-payment": state.modal={type:"record-payment", sid:el.getAttribute("data-sid")||null}; render(); break;
    case "void-payment":
      state.modal = {type:"confirm", title:"Void payment", message:"Voiding this payment will add its amount back to the student's outstanding balance.", confirmLabel:"Void payment",
        onConfirm:function(){
          var st = getStudent(el.getAttribute("data-sid"));
          var p = st.payments.filter(function(x){return x.id===el.getAttribute("data-pid");})[0];
          if (p) p.status = "Voided";
          saveData(); showToast("Payment voided");
        }};
      render(); break;

    case "open-add-fee-template": state.modal={type:"add-fee-template"}; render(); break;
    case "open-edit-fee-template": state.modal={type:"edit-fee-template", id:el.getAttribute("data-id")}; render(); break;
    case "delete-fee-template":
      var fid = el.getAttribute("data-id");
      data.feeTemplates = data.feeTemplates.filter(function(f){return f.id!==fid;});
      saveData(); showToast("Fee template deleted"); render(); break;

    case "view-receipt": state.modal={type:"view-receipt", sid:el.getAttribute("data-sid"), pid:el.getAttribute("data-pid")}; render(); break;

    case "confirm-yes":
      if (state.modal && state.modal.onConfirm) state.modal.onConfirm();
      state.modal = null; render(); break;

    case "pay-fill-full":
      var stuF = currentStudent(); var tF = computeTotals(stuF);
      state.pay.amount = tF.balance; render(); break;
    case "pay-select-method":
      state.pay.method = el.getAttribute("data-method"); render(); break;
    case "pay-proceed":
      var amtInput = document.getElementById("payAmountInput");
      var errBox = document.getElementById("payAmountError");
      var stuP = currentStudent(); var tP = computeTotals(stuP);
      var amt = amtInput ? parseFloat(amtInput.value) : state.pay.amount;
      if (!amt || amt <= 0 || amt > tP.balance + 0.001){
        if (errBox) errBox.classList.add("show");
        return;
      }
      state.pay.amount = Math.round(amt*100)/100;
      if (state.pay.method === "QR"){
        var qrReq = createQrRequest(stuP, state.pay.amount);
        state.pay.requestId = qrReq.id;
        state.pay.qrPayload = JSON.stringify({
          type:"payment_request", school:data.school.name, provider:PAYMENT_CONFIG.qr.provider,
          requestId:qrReq.id, refNo:qrReq.refNo, studentId:stuP.id, studentNo:stuP.studentId,
          amount:state.pay.amount, currency:"PHP", expiresAt:qrReq.expiresAt
        });
        state.pay.step = "qr-wait";
      } else {
        state.pay.step = "gateway"; state.pay.processing = false;
      }
      render(); break;
    case "pay-cancel":
      if (state.pay.step === "qr-wait" && state.pay.requestId){
        var cancelReq = data.qrRequests.filter(function(r){return r.id===state.pay.requestId;})[0];
        if (cancelReq && cancelReq.status === "pending"){ cancelReq.status = "cancelled"; saveData(); }
      }
      state.pay.step = "select"; render(); break;
    case "pay-confirm-gateway":
      state.pay.processing = true; render();
      setTimeout(function(){ completePayment(); }, 1400);
      break;
    case "qr-simulate-scan":
      confirmQrRequestById(el.getAttribute("data-id"));
      render(); break;
    case "pay-new":
      state.pay = null; state.studentTab = "overview"; render(); break;

    case "print-receipt":
      window.print(); break;
    case "download-receipt":
      downloadReceipt(el.getAttribute("data-rid")); break;

    case "clear-report-filter":
      state.reportFrom=""; state.reportTo=""; render(); break;
    case "export-report-csv":
      exportReportCsv(); break;

    case "open-scan-qr":
      state.modal = {type:"scan-qr"}; render(); break;
    case "start-camera-scan":
      startCameraScan(); break;
    case "confirm-qr-request":
      confirmQrRequestById(el.getAttribute("data-id"));
      render(); break;
    case "qr-manual-lookup":
      var manualInput = document.getElementById("qrManualInput");
      var raw = manualInput ? manualInput.value.trim() : "";
      handleScannedPayload(raw);
      break;
  }
});

function removeFrom(arr, id){
  var idx = arr.findIndex(function(x){return x.id===id;});
  if (idx>-1) arr.splice(idx,1);
}

function completePayment(){
  // SWAP POINT: in production this would not run client-side at all.
  // The "Confirm & Pay" button would POST to
  // PAYMENT_CONFIG.gcash.createPaymentEndpoint / .paypal.createPaymentEndpoint,
  // the backend would call the real GCash/PayPal API, and the balance
  // would only update once that provider's webhook confirms settlement
  // (see the integration guide). Everything below is the simulated stand-in.
  var stu = currentStudent();
  if (!stu || !state.pay) return;
  var method = state.pay.method;
  var amount = state.pay.amount;
  var receiptNo = nextReceiptNo();
  var refNo = refNumber(method === "GCash" ? "GC" : "PP");
  var payment = {
    id: uid("p"), date: new Date().toISOString(), method: method, amount: amount,
    refNo: refNo, receiptNo: receiptNo, status: "Completed", note: "Online payment"
  };
  stu.payments.push(payment);
  saveData();
  var t = computeTotals(stu);
  state.pay.step = "success";
  state.pay.processing = false;
  state.pay.receipt = {
    id: payment.id, receiptNo: receiptNo, date: payment.date, studentName: stu.name, studentNo: stu.studentId,
    method: method, refNo: refNo, amount: amount, balanceAfter: t.balance, status: "Completed"
  };
  render();
}

   QR PAYMENTS
=============================================================== */
function createQrRequest(stu, amount){
  // SWAP POINT: in production, POST to PAYMENT_CONFIG.qr.createPaymentEndpoint
  // and use the real QR Ph payload the backend/aggregator returns instead of
  // building refNo/expiresAt locally. Shape kept intent-like on purpose.
  var req = {
    id: uid("qr"), studentId: stu.id, studentName: stu.name, studentNo: stu.studentId,
    amount: amount, currency: "PHP", refNo: refNumber("QR"),
    merchantId: PAYMENT_CONFIG.qr.merchantId, provider: PAYMENT_CONFIG.qr.provider,
    status: "pending", createdAt: new Date().toISOString(),
    expiresAt: new Date(Date.now() + 15*60000).toISOString(),
    mode: PAYMENT_CONFIG.qr.mode, paymentId: null
  };
  data.qrRequests.push(req);
  saveData();
  return req;
}

function confirmQrRequestById(id){
  // SWAP POINT: in production this fires from PAYMENT_CONFIG.qr.webhookEndpoint
  // when the aggregator confirms settlement — never from a button an admin
  // clicks in the browser, so a scan can't be faked into a real payment.
  var req = (data.qrRequests||[]).filter(function(r){return r.id===id;})[0];
  if (!req){ showToast("Request not found"); return; }
  if (req.status !== "pending"){ showToast("This request was already " + req.status); return; }
  var stu = getStudent(req.studentId);
  if (!stu){ showToast("Student not found"); return; }
  var payment = {
    id: uid("p"), date: new Date().toISOString(), method: "QR", amount: req.amount,
    refNo: req.refNo, receiptNo: nextReceiptNo(), status: "Completed", note: "Confirmed via QR scan"
  };
  stu.payments.push(payment);
  req.status = "completed";
  req.paymentId = payment.id;
  saveData();
  showToast("Payment of " + fmtMoney(req.amount) + " confirmed for " + stu.name);
  if (state.modal && state.modal.type === "scan-qr"){ stopScan(); state.modal = null; }
}

var scanStream = null;
function startCameraScan(){
  var statusEl = document.getElementById("qrScanStatus");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (statusEl) statusEl.textContent = "Camera isn\u2019t available in this browser \u2014 use the list or manual entry below.";
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){
    scanStream = stream;
    var video = document.getElementById("qrVideo");
    if (!video){ stopScan(); return; }
    video.srcObject = stream;
    video.setAttribute("playsinline", "true");
    video.play();
    if (statusEl) statusEl.textContent = "Point the camera at the student\u2019s QR code\u2026";
    requestAnimationFrame(scanTick);
  }).catch(function(){
    if (statusEl) statusEl.textContent = "Camera access was denied or unavailable \u2014 use the list or manual entry below.";
  });
}
function scanTick(){
  if (!scanStream) return;
  var video = document.getElementById("qrVideo");
  var canvas = document.getElementById("qrCanvas");
  if (video && canvas && window.jsQR && video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var code = window.jsQR(imgData.data, imgData.width, imgData.height);
    if (code && code.data){
      handleScannedPayload(code.data);
      return;
    }
  }
  if (scanStream) requestAnimationFrame(scanTick);
}
function handleScannedPayload(text){
  stopScan();
  var payload = null;
  try{ payload = JSON.parse(text); }catch(e){ payload = null; }
  var requestId = payload && payload.requestId ? payload.requestId : text;
  if (!requestId){ showToast("QR code not recognized"); render(); return; }
  confirmQrRequestById(requestId);
  render();
}
function stopScan(){
  if (scanStream){
    scanStream.getTracks().forEach(function(tr){ tr.stop(); });
    scanStream = null;
  }
}

function downloadReceipt(rid){
  var receiptData = null;
  data.students.forEach(function(st){
    st.payments.forEach(function(p){
      if (p.id === rid){
        var idx = st.payments.indexOf(p);
        var runningPaid = 0;
        st.payments.forEach(function(pp,i){ if(i<=idx && pp.status==="Completed") runningPaid += pp.amount; });
        var t = computeTotals(st);
        receiptData = {receiptNo:p.receiptNo, date:p.date, studentName:st.name, studentNo:st.studentId, method:p.method, refNo:p.refNo, amount:p.amount, balanceAfter:t.assessment-runningPaid, status:p.status};
      }
    });
  });
  if (!receiptData) return;
  var text = "OFFICIAL DIGITAL RECEIPT\n" + data.school.name + "\n" + data.school.term + "\n\n" +
    "Receipt No: " + receiptData.receiptNo + "\n" +
    "Date: " + fmtDateTime(receiptData.date) + "\n" +
    "Student: " + receiptData.studentName + " (" + receiptData.studentNo + ")\n" +
    "Payment Method: " + receiptData.method + "\n" +
    "Reference No: " + receiptData.refNo + "\n" +
    "Amount Paid: " + fmtMoney(receiptData.amount) + "\n" +
    "Remaining Balance: " + fmtMoney(Math.max(receiptData.balanceAfter,0)) + "\n" +
    "Status: " + receiptData.status + "\n";
  offerDownload(receiptData.receiptNo + ".txt", text);
}

function exportReportCsv(){
  var from = state.reportFrom ? new Date(state.reportFrom) : null;
  var to = state.reportTo ? new Date(state.reportTo+"T23:59:59") : null;
  var pays = allPayments().filter(function(p){
    if (p.status!=="Completed") return false;
    var d = new Date(p.date);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
  var lines = ["Date,Student Name,Student Number,Method,Reference No,Receipt No,Amount"];
  pays.forEach(function(p){
    lines.push([fmtDate(p.date), csvSafe(p.studentName), p.studentNo, p.method, p.refNo, p.receiptNo, p.amount].join(","));
  });
  offerDownload("payment-report.csv", lines.join("\n"));
}
function csvSafe(s){
  s = String(s);
  if (s.indexOf(",")>-1 || s.indexOf('"')>-1) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function offerDownload(filename, text){
  if (window.claude && window.__downloadsNS){
    window.__downloadsNS.save({filename:filename, data:text}).then(function(){
      showToast("Saved " + filename);
    }).catch(function(err){
      fallbackDownload(filename, text);
    });
  } else {
    fallbackDownload(filename, text);
  }
}
function fallbackDownload(filename, text){
  try{
    var blob = new Blob([text], {type:"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Downloaded " + filename);
  }catch(e){
    showToast("Unable to download here");
  }
}

document.addEventListener("submit", function(e){
  var form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  var kind = form.getAttribute("data-form");
  var fd = new FormData(form);

  if (kind === "login"){
    var id = (fd.get("id")||"").trim();
    var pw = (fd.get("password")||"").trim();
    if (state.loginRole === "student"){
      var stu = data.students.filter(function(s){return s.studentId===id;})[0];
      if (stu && stu.password === pw){
        state.session = {role:"student", studentId:stu.id}; saveSession();
        state.loginError=""; state.studentTab="overview"; render();
      } else {
        state.loginError = "Student number or password is incorrect."; render();
      }
    } else {
      if (id === data.admin.username && pw === data.admin.password){
        state.session = {role:"admin"}; saveSession(); state.loginError=""; state.adminTab="overview"; render();
      } else {
        state.loginError = "Username or password is incorrect."; render();
      }
    }
    return;
  }

  if (kind === "update-profile"){
    var stuU = currentStudent();
    stuU.email = fd.get("email"); stuU.phone = fd.get("phone");
    saveData(); showToast("Profile updated"); render(); return;
  }

  if (kind === "add-student"){
    var dupId = fd.get("studentId").trim();
    if (data.students.some(function(s){return s.studentId===dupId;})){
      showToast("That student number already exists"); return;
    }
    data.students.push({
      id: uid("s"), studentId: dupId, password: (fd.get("password")||"student123").trim(),
      name: fd.get("name").trim(), program: fd.get("program").trim(), year: fd.get("year").trim(),
      email: fd.get("email").trim(), phone: fd.get("phone").trim(),
      fees:[], adjustments:[], payments:[]
    });
    saveData(); state.modal=null; showToast("Student added"); render(); return;
  }

  if (kind === "edit-student"){
    var stE = getStudent(form.getAttribute("data-id"));
    stE.name=fd.get("name").trim(); stE.studentId=fd.get("studentId").trim(); stE.program=fd.get("program").trim();
    stE.year=fd.get("year").trim(); stE.email=fd.get("email").trim(); stE.phone=fd.get("phone").trim();
    saveData(); state.modal=null; showToast("Student updated"); render(); return;
  }

  if (kind === "add-fee"){
    var sidF = form.getAttribute("data-sid");
    var stF = getStudent(sidF);
    var tmplId = fd.get("templateId");
    var name, category, amount;
    amount = parseFloat(fd.get("amount"));
    if (tmplId){
      var tmpl = data.feeTemplates.filter(function(t){return t.id===tmplId;})[0];
      name = fd.get("name") || tmpl.name; category = tmpl.category;
    } else {
      name = fd.get("name"); category = fd.get("category");
    }
    stF.fees.push({id:uid("f"), name:name, category:category, amount: amount||0});
    saveData(); state.modal=null; showToast("Fee added"); render(); return;
  }

  if (kind === "add-adjustment"){
    var sidA = form.getAttribute("data-sid");
    var stA = getStudent(sidA);
    stA.adjustments.push({id:uid("adj"), date:new Date().toISOString(), type:fd.get("type"), amount:parseFloat(fd.get("amount"))||0, note:fd.get("note")});
    saveData(); state.modal=null; showToast("Adjustment added"); render(); return;
  }

  if (kind === "record-payment"){
    var sidR = fd.get("studentId") || (state.modal && state.modal.sid);
    var stR = getStudent(sidR);
    if (!stR){ showToast("Select a student"); return; }
    var amtR = parseFloat(fd.get("amount"));
    var methodR = fd.get("method");
    var prefix = methodR==="GCash"?"GC":(methodR==="PayPal"?"PP":(methodR==="QR"?"QR":"MAN"));
    stR.payments.push({
      id: uid("p"), date: new Date().toISOString(), method: methodR, amount: amtR,
      refNo: refNumber(prefix), receiptNo: nextReceiptNo(), status:"Completed", note: fd.get("note")||""
    });
    saveData(); state.modal=null; showToast("Payment recorded"); render(); return;
  }

  if (kind === "add-fee-template"){
    data.feeTemplates.push({id:uid("ft"), name:fd.get("name").trim(), category:fd.get("category"), defaultAmount:parseFloat(fd.get("defaultAmount"))||0});
    saveData(); state.modal=null; showToast("Fee template created"); render(); return;
  }
  if (kind === "edit-fee-template"){
    var ftE = data.feeTemplates.filter(function(f){return f.id===form.getAttribute("data-id");})[0];
    ftE.name=fd.get("name").trim(); ftE.category=fd.get("category"); ftE.defaultAmount=parseFloat(fd.get("defaultAmount"))||0;
    saveData(); state.modal=null; showToast("Fee template updated"); render(); return;
  }
});

/* live search / filter inputs (event delegation on input) */
document.addEventListener("input", function(e){
  if (e.target.id === "studentSearchInput"){ state.studentSearch = e.target.value; renderPreserveFocus("studentSearchInput"); }
  if (e.target.id === "paymentSearchInput"){ state.paymentFilter.search = e.target.value; renderPreserveFocus("paymentSearchInput"); }
  if (e.target.id === "payAmountInput"){
    var v = parseFloat(e.target.value);
    if (state.pay) state.pay.amount = isNaN(v) ? 0 : v;
    var btn = document.getElementById("payProceedBtn");
    if (btn) btn.textContent = "Proceed to pay " + fmtMoney(state.pay ? state.pay.amount : 0);
    var errBox = document.getElementById("payAmountError");
    if (errBox) errBox.classList.remove("show");
  }
});
document.addEventListener("change", function(e){
  if (e.target.id === "paymentMethodFilter"){ state.paymentFilter.method = e.target.value; render(); }
  if (e.target.id === "reportFrom"){ state.reportFrom = e.target.value; render(); }
  if (e.target.id === "reportTo"){ state.reportTo = e.target.value; render(); }
});

function renderPreserveFocus(id){
  var el = document.getElementById(id);
  var pos = el ? el.selectionStart : null;
  render();
  var el2 = document.getElementById(id);
  if (el2){ el2.focus(); if (pos!=null) el2.setSelectionRange(pos,pos); }
}

/* ============================================================
   INIT
=============================================================== */
render();
initDb();

})();
</script>
</body>
</html>
